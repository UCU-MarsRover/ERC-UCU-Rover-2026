name: Publish Production And Development Images

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docker/**'
      - 'src/**'
      - '.github/workflows/publish_image.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Lowercase Repository Name
        id: image
        run: |
          REPO="${{ github.repository }}"
          echo "name=${REPO,,}" >> "$GITHUB_OUTPUT"

  tag:
    uses: UCUSpaceRobotics/.github/.github/workflows/version-tag.yml@main
    permissions:
      contents: write

  build-and-push-prod-arm64:
    needs: [tag, meta]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Extract Docker metadata for PROD image
        id: metadata-tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.meta.outputs.image }}
          flavor: |
            suffix=-prod
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=raw,value=${{ needs.tag.outputs.new_tag }}
          labels: |
            org.opencontainers.image.description=Production Image (ARM64) for Indomitus Rover

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push PROD Image (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          platforms: linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=ros:humble-ros-base
          tags: ${{ steps.metadata-tags.outputs.tags }}
          labels: ${{ steps.metadata-tags.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ needs.meta.outputs.image }}-cache:prod-arm64
          cache-to: type=registry,mode=min,ref=${{ env.REGISTRY }}/${{ needs.meta.outputs.image }}-cache:prod-arm64

  build-and-push-dev-amd64:
    needs: [tag, meta]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Extract Docker metadata for DEV image
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.meta.outputs.image }}
          flavor: |
            suffix=-dev
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ needs.tag.outputs.new_tag }}
          labels: |
            org.opencontainers.image.description=Development Image (AMD64) for Indomitus Rover with Simulation Tools

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push DEV Image (AMD64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          platforms: linux/amd64
          push: true
          build-args: |
            INSTALL_SIM_TOOLS=true
            BASE_IMAGE=ros:humble-ros-base
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ needs.meta.outputs.image }}-cache:dev-amd64
          cache-to: type=registry,mode=min,ref=${{ env.REGISTRY }}/${{ needs.meta.outputs.image }}-cache:dev-amd64

  # Body is package links only, on purpose — no auto-generated changelog text.
  release:
    needs: [tag, meta, build-and-push-prod-arm64, build-and-push-dev-amd64]
    uses: UCUSpaceRobotics/.github/.github/workflows/release.yml@main
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.new_tag }}
      body: |
        ```bash
        docker pull ghcr.io/${{ needs.meta.outputs.image }}:${{ needs.tag.outputs.new_tag }}-prod
        ```

        ```bash
        docker pull ghcr.io/${{ needs.meta.outputs.image }}:${{ needs.tag.outputs.new_tag }}-dev
        ```
