/**/lights_can_node:
  ros__parameters:

    can:
      # CAN ID for sending commands to ESP32
      cmd_id: 0x300

      # CAN ID for responses from ESP32
      resp_id: 0x301

      # Commands
      cmd_spotlight_on:          0x01  # both spotlight pins
      cmd_spotlight_off:         0x02
      cmd_traffic_light:         0x03  # byte 1 = bitmask R=bit0 G=bit1 B=bit2
      cmd_beautiful_light_on:    0x04  # decorative animation, all 4 pins
      cmd_beautiful_light_off:   0x05
      cmd_red_on:                 0x06
      cmd_red_off:                0x07
      cmd_green_on:               0x08
      cmd_green_off:              0x09
      cmd_blue_on:                0x0A
      cmd_blue_off:               0x0B
      cmd_buzzer_on:              0x0C
      cmd_buzzer_off:             0x0D
      cmd_spotlight_left_on:      0x20
      cmd_spotlight_left_off:     0x21
      cmd_spotlight_right_on:     0x22
      cmd_spotlight_right_off:    0x23
      cmd_beautiful_1_on:         0x24
      cmd_beautiful_1_off:        0x25
      cmd_beautiful_2_on:         0x26
      cmd_beautiful_2_off:        0x27
      cmd_beautiful_3_on:         0x28
      cmd_beautiful_3_off:        0x29
      cmd_beautiful_4_on:         0x2A
      cmd_beautiful_4_off:        0x2B
      cmd_tower_on:               0x2C
      cmd_tower_off:              0x2D

      # 0x10-0x15 are the power telemetry commands on this same ESP32 - see
      # power_node.yaml. power_node sends them and matches its own ACKs off
      # resp_id, so do not reassign them to a light here.

      # Status responses from ESP32
      status_ok:    0x00
      status_error: 0x01

    timeouts: # in seconds
      ack_s: 2.0

    # lights/state is published on change, no faster than this. It crosses the
    # Wi-Fi link to the ground station, and nothing downstream needs it quicker
    # than the joystick repaints its light bar (also 2 Hz).
    state_pub_rate: 2.0
